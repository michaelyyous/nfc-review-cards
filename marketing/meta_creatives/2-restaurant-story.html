<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'Schibsted Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;
 padding:230px 84px 330px;position:relative;-webkit-font-smoothing:antialiased}
.light{background:#F6F7F6;color:#0E1110}.tint{background:#EAF6EF;color:#0E1110}
.dark{background:#0E1110;color:#fff}.green{background:#14724A;color:#fff}
.brand{display:flex;align-items:center;gap:18px;font-weight:700;font-size:34px;letter-spacing:-.01em}
.brand img{width:64px;height:64px;border-radius:16px}
.eyebrow{margin-top:70px;font-size:30px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.65}
h1{margin-top:18px;font-size:108px;line-height:1.0;font-weight:800;letter-spacing:-.035em}
h1 .g{color:#14724A}
.sub{margin-top:30px;font-size:38px;line-height:1.3;max-width:880px;opacity:.82;font-weight:500}
.stage{flex:1 1 0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;margin-top:24px}
.cw{height:min(760px,90%);position:relative}.cw.c0{transform:rotate(-7deg)}.cw.c1{transform:rotate(8deg);margin-left:-120px}
.card{height:100%;display:block;border-radius:28px;box-shadow:0 40px 80px rgba(0,0,0,.28),0 8px 20px rgba(0,0,0,.15)}
.dark .card{box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.08)}
.tap{position:absolute;width:150px;left:calc(100% + 24px);top:22%;color:#14724A;transform:rotate(7deg)}
.dark .tap,.green .tap{color:#F5B301}
.badge{align-self:flex-start;margin-top:26px;background:#14724A;color:#fff;font-weight:700;font-size:34px;padding:20px 34px;border-radius:999px}
.dark .badge{background:#F5B301;color:#0E1110}.green .badge{background:#fff;color:#14724A}
.stars{display:flex;gap:6px}.st{width:40px;fill:#F5B301}
.vs{display:flex;gap:28px;margin-top:70px}
.vs>div{flex:1;background:#fff;border-radius:28px;padding:28px 34px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 0 0 1px rgba(14,17,16,.08)}
.vs .n{font-size:120px;font-weight:800;letter-spacing:-.04em;line-height:1}
.vs .l{font-size:28px;font-weight:600;opacity:.6;margin-top:10px}
.vs .you .n{color:#14724A}
.ticks{list-style:none;margin-top:34px;display:flex;flex-direction:column;gap:16px}
.ticks li{font-size:38px;font-weight:600;display:flex;gap:18px;align-items:center}
.ticks li:before{content:'✓';width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:28px;flex:none}
</style></head><body class="dark">
<div class="brand"><img src="logo-512.png">ReviewPartneren</div>
<div class="eyebrow">Til restauranter og caféer</div>
<h1>Ét tap.<br>Én anmeldelse.</h1><p class="sub">Læg anmeldelseskortet med regningen. Gæsten tapper med telefonen – jeres Google-side åbner.</p>
<div class="stage"><div class="cw c0"><img class="card" src="tex-front.png"><svg class="tap" viewBox="-4 -42 48 84" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"><path d="M0 -12A12 12 0 0 1 0 12"/><path d="M0 -24A24 24 0 0 1 0 24" opacity=".7"/><path d="M0 -36A36 36 0 0 1 0 36" opacity=".4"/></svg></div></div>
<div class="badge">Fra 189 kr · gratis levering</div>
</body></html>
