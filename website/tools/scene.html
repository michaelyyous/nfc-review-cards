<!doctype html>
<meta charset="utf-8">
<title>Counter scene renderer</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>window.__cardNoViewer = true;</script>
<script type="module">
// Front-page hero: the card in use. A card on a stone counter, a phone being
// lowered onto it, a small stack of black-side cards behind. Same 3D card and
// artwork as the rest of the site.
import { THREE, CARD, makeCard, makeRenderer, loadTextures } from '../assets/card3d.js';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/environments/RoomEnvironment.js/+esm';

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1600, H = +q.get('h') || 1280;
const deg = THREE.MathUtils.degToRad;
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

const renderer = makeRenderer(document.getElementById('c'), { preserve: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.42;

/* ---------- counter: warm light stone, generated so nothing is borrowed */
function stoneTexture() {
  const S = 2048, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#E4DCCF'; g.fillRect(0, 0, S, S);
  // Value noise: tiny random canvases scaled up with bilinear smoothing, a few
  // octaves on top of each other. Fast, and reads as natural stone.
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  for (const [n, a] of [[6, .10], [18, .08], [60, .06], [220, .05]]) {
    const t = document.createElement('canvas'); t.width = t.height = n;
    const tg = t.getContext('2d'), id = tg.createImageData(n, n);
    for (let i = 0; i < id.data.length; i += 4) {
      const v = rnd() * 255;
      id.data[i] = v; id.data[i + 1] = v * .97; id.data[i + 2] = v * .9; id.data[i + 3] = 255;
    }
    tg.putImageData(id, 0, 0);
    g.globalAlpha = a; g.globalCompositeOperation = 'overlay';
    g.drawImage(t, 0, 0, S, S);
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const img = g.getImageData(0, 0, S, S), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = (rnd() - .5) * 9; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const floorTex = stoneTexture();
floorTex.repeat.set(2.2, 2.2);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.82 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* ---------- light: one big soft window light from the upper left */
const key = new THREE.SpotLight(0xFFF6EA, 2600, 0, deg(30), 0.95, 2);
key.position.set(-16, 48, 8);
key.target.position.set(1, 0, 2);
key.castShadow = true;
key.shadow.mapSize.set(512, 512);
key.shadow.bias = -0.0003;
key.shadow.radius = 6;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xE8EEFF, 0.25);
fill.position.set(12, 10, 14);
scene.add(fill);

/* ---------- cards */
const [front, back] = await loadTextures(renderer, new URL('../', location.href).href);

function softShadow(w, h, opacity, blur = 22) {
  const sc = document.createElement('canvas');
  sc.width = 320; sc.height = 460;
  const g = sc.getContext('2d');
  g.filter = `blur(${blur}px)`;
  g.fillStyle = '#000';
  g.beginPath(); g.roundRect(56, 56, 208, 348, 14); g.fill();
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w * 320 / 208, h * 460 / 348),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, opacity, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  return m;
}

function lay(side, x, y, z, turn, shadow = 0.28) {
  const card = makeCard(front, back);
  card.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  card.rotation.set(side === 'white' ? -Math.PI / 2 : Math.PI / 2, 0, side === 'white' ? 0 : Math.PI);
  card.position.y = CARD.d / 2;
  const h = new THREE.Group();
  h.add(card);
  if (shadow) { const s = softShadow(CARD.w, CARD.h, shadow); s.position.set(0.18, -y + 0.002, 0.26); h.add(s); }
  h.rotation.y = turn;
  h.position.set(x, y, z);
  scene.add(h);
  return h;
}

// The hero: white side up, where the phone lands.
const hero = lay('white', +q.get('cardx') || -3, 0, +q.get('cardz') || 1.8, deg(+q.get('cardr') || 7));

// A small, slightly messy stack, black side up, behind and to the right.
for (let i = 0; i < 7; i++) {
  lay('black', (+q.get('sx') || -9.5) + (rnd() - .5) * .14, i * (CARD.d + .004), (+q.get('sz') || -5) + (rnd() - .5) * .14,
      deg((+q.get('sr') || 14) + (rnd() - .5) * 3), i === 0 ? 0.32 : 0);
}

/* ---------- phone, being lowered onto the card */
function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function screenTexture() {
  const w = 900, h = 1860, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  const m = 26;                                  // bezel
  g.fillStyle = '#FFFFFF';
  g.beginPath(); g.roundRect(m, m, w - 2 * m, h - 2 * m, 104); g.fill();
  g.fillStyle = '#000';
  g.beginPath(); g.roundRect(w / 2 - 120, m + 30, 240, 70, 35); g.fill();   // island
  const font = '-apple-system, "SF Pro Display", "Helvetica Neue", sans-serif';
  g.fillStyle = '#111';
  g.font = `600 44px ${font}`; g.fillText('9:41', 96, 102);
  g.textAlign = 'center';
  g.font = `700 70px ${font}`; g.fillText('Hvordan var', w / 2, 470);
  g.fillText('dit besøg?', w / 2, 556);
  g.font = `400 40px ${font}`; g.fillStyle = '#6B6F76';
  g.fillText('Tryk på en stjerne', w / 2, 640);
  const star = (cx, cy, r) => {
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
      g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    g.closePath(); g.fill();
  };
  g.fillStyle = '#F4B521';
  for (let i = 0; i < 5; i++) star(w / 2 + (i - 2) * 138, 790, 58);
  g.strokeStyle = '#D9DCE1'; g.lineWidth = 4;
  g.beginPath(); g.roundRect(90, 920, w - 180, 360, 28); g.stroke();
  g.textAlign = 'left'; g.fillStyle = '#9AA0A6'; g.font = `400 40px ${font}`;
  g.fillText('Fortæl om din oplevelse …', 130, 1000);
  g.fillStyle = '#1A73E8';
  g.beginPath(); g.roundRect(90, 1340, w - 180, 120, 60); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = `600 46px ${font}`;
  g.fillText('Send', w / 2, 1415);
  g.fillStyle = '#111';
  g.beginPath(); g.roundRect(w / 2 - 140, h - m - 44, 280, 12, 6); g.fill();   // home bar
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function makePhone() {
  const PW = 7.15, PH = 14.7, PD = 0.78, R = 1.05, b = 0.06;
  const grp = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.ExtrudeGeometry(roundedRect(PW - 2 * b, PH - 2 * b, R - b),
      { depth: PD - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 4, curveSegments: 32 }),
    new THREE.MeshPhysicalMaterial({ color: 0x3A3B3F, metalness: 0.75, roughness: 0.32 }));
  body.geometry.translate(0, 0, -(PD - 2 * b) / 2);
  body.castShadow = true;
  grp.add(body);
  const sg = new THREE.ShapeGeometry(roundedRect(PW - 0.12, PH - 0.12, R - 0.06), 32);
  const pos = sg.attributes.position, uv = sg.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + (PW - .12) / 2) / (PW - .12), (pos.getY(i) + (PH - .12) / 2) / (PH - .12));
  const screen = new THREE.Mesh(sg, new THREE.MeshPhysicalMaterial({
    color: 0x000000, emissive: 0xffffff, emissiveMap: screenTexture(), emissiveIntensity: 0.92,
    roughness: 0.06, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.04,
  }));
  screen.position.z = PD / 2 + 0.002;
  grp.add(screen);
  return { grp, PH };
}
const { grp: phone, PH } = makePhone();
// Lie it screen-up, top end pointing away, then hinge it at the top end.
phone.rotation.x = -Math.PI / 2;
phone.position.z = PH / 2;
const hinge = new THREE.Group();
hinge.add(phone);
hinge.rotation.order = 'YXZ';
hinge.rotation.y = deg(+q.get('py') || -72);
hinge.rotation.x = -deg(+q.get('px') || 28);   // bottom end lifted toward the viewer
// Top end hovers just above the card's middle, where the chip is.
const hp = new THREE.Vector3(+q.get('hx') || 0.6, +q.get('hy') || 1.1, +q.get('hz') || -2.4).applyEuler(hero.rotation).add(hero.position);
hinge.position.copy(hp);
scene.add(hinge);

/* ---------- camera */
const camera = new THREE.PerspectiveCamera(+q.get('fov') || 30, W / H, 1, 300);
camera.position.set(+q.get('cx') || 3, +q.get('cy') || 30, +q.get('cz') || 26);
camera.lookAt(+q.get('lx') || 1, 0, +q.get('lz') || 1.5);

renderer.render(scene, camera);
document.title = 'done';
</script>
